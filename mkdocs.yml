site_name: Termite Docs
site_url: https://mohammad-h93.github.io/docs-test/

nav:
  - Home: index.md
  - About Termite: about.md
  - Getting started: getting-started.md
  - Core concepts: concepts.md
  - Generate a unit mix: unit-mix.md
  - Generate a plan: plan.md
  - Furniture: furniture.md
  - Code compliance: code-compliance.md
  - Roadmap: roadmap.md
  - Settings: settings.md
  - Modeling tips: modeling-tips.md


theme:

  font:
    text: Inter
    code: JetBrains Mono
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - navigation.indexes

  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details

extra_css:
  - stylesheets/extra.css